<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juno Gardens</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'IBMSelectric';
    src: url('IBM-Selectric-Light-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'IBMSelectric';
    src: url('IBM-Selectric-Light-Italic.ttf') format('truetype');
    font-weight: normal;
    font-style: italic;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: 'IBMSelectric', serif;
    color: #FFED00;
    font-synthesis: none;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 120%;
    height: 100%;
    object-fit: cover;
    animation: pan 60s linear infinite alternate;
  }

  @keyframes pan {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-16%); }
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(40, 30, 90, 0.35);
    z-index: -1;
    pointer-events: none;
  }

  .menu-btn {
    position: fixed;
    top: 24px;
    left: 24px;
    font-size: 32px;
    color: #FFED00;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    font-family: 'IBMSelectric', serif;
    z-index: 10;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 15vh 20px 60px;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .site-title {
    font-family: 'TaylorGothic', serif;
    font-weight: normal;
    font-size: 100px;
    margin: 0;
    line-height: 1;
    letter-spacing: 2px;
    font-synthesis: none;
    text-shadow: 2px 2px 2px #5B45E0;
  }

  .symbol {
    height: 84px;
    width: auto;
    display: block;
  }

  .subtitle {
    font-size: 32px;
    font-weight: bold;
    margin-top: 28px;
    letter-spacing: 1px;
    font-style: italic;
    text-shadow: 1px 1px 2px #5B45E0;
  }

  .intro {
    max-width: 700px;
    width: 100%;
    margin: 12vh auto 0;
    text-align: left;
    font-size: 24px;
    font-weight: bold;
    line-height: 1.6;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 2px #5B45E0;
  }

  .carousel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    margin: 10vh auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 20px;
    box-sizing: border-box;
  }

  .carousel-track {
    display: flex;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: rgba(40, 30, 90, 0.25);
    border-radius: 4px;
    position: relative;
  }

  .carousel-track img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .carousel-track img.active {
    opacity: 1;
  }

  .carousel-btn {
    background: none;
    border: none;
    color: #FFED00;
    font-size: 44px;
    cursor: pointer;
    padding: 8px;
    line-height: 1;
    font-family: 'IBMSelectric', serif;
    text-shadow: 1px 1px 2px #5B45E0;
    flex-shrink: 0;
  }

  .footer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 60px 20px 40px;
    font-size: 22px;
    text-shadow: 1px 1px 2px #5B45E0;
  }

  .footer a {
    color: #FFED00;
    text-decoration: none;
  }

  .footer .insta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .footer svg {
    width: 26px;
    height: 26px;
    fill: #FFED00;
    filter: drop-shadow(1px 1px 1px #5B45E0);
  }

  @media (max-width: 700px) {
    .site-title { font-size: 56px; }
    .symbol { height: 48px; }
    .subtitle { font-size: 20px; margin-top: 18px; }
    .menu-btn { font-size: 28px; top: 18px; left: 18px; }
    .hero { padding: 12vh 20px 40px; }
    .intro { font-size: 17px; margin-top: 8vh; }
    .bg img { animation: none; width: 100%; }
    .footer { font-size: 17px; padding: 40px 20px 30px; }
    .carousel-btn { font-size: 30px; }
    .carousel { gap: 6px; padding: 0 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="background.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <button class="menu-btn" aria-label="Menu">☰</button>

  <div class="hero">
    <div class="title-row">
      <h1 class="site-title">Juno Gardens</h1>
      <img src="Dumpling-Venus-Symbol-Yellow.png" alt="Juno Gardens symbol" class="symbol">
    </div>
    <p class="subtitle">Sustainable Garden Design &amp; Maintenance</p>

    <p class="intro">
      Lovable &amp; Edible. SE London based gardening services. Focussing on resilient, sustainable &amp; beautiful plants for luscious urban gardens.
    </p>
  </div>

  <div class="carousel">
    <button class="carousel-btn" id="prev" aria-label="Previous">&#8249;</button>
    <div class="carousel-track" id="track">
      <img src="IMG_1047.jpg" alt="" loading="lazy">
      <img src="IMG_3875.jpg" alt="" loading="lazy">
      <img src="IMG_3884.jpg" alt="" loading="lazy">
      <img src="IMG_4804.jpg" alt="" loading="lazy">
      <img src="IMG_4817.jpg" alt="" loading="lazy">
    </div>
    <button class="carousel-btn" id="next" aria-label="Next">&#8250;</button>
  </div>

  <div class="footer">
    <a class="insta" href="https://instagram.com/juno.gardens" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.2.8-.4.4-.6.7-.8 1.2-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.2.4.4.7.6 1.2.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.2-.8.4-.4.6-.7.8-1.2.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.2-.4-.4-.7-.6-1.2-.8-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.1a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 8.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm6.4-8.4a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>
      @juno.gardens
    </a>
    <a href="mailto:junogardens@gmail.com">junogardens@gmail.com</a>
  </div>

  <script>
    const imgs = document.querySelectorAll('.carousel-track img');
    let current = 0;
    imgs[current].classList.add('active');

    document.getElementById('next').addEventListener('click', () => {
      imgs[current].classList.remove('active');
      current = (current + 1) % imgs.length;
      imgs[current].classList.add('active');
    });

    document.getElementById('prev').addEventListener('click', () => {
      imgs[current].classList.remove('active');
      current = (current - 1 + imgs.length) % imgs.length;
      imgs[current].classList.add('active');
    });
  </script>

</body>
</html>
